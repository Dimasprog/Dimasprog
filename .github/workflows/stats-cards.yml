name: Generate Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and commit stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.PAT_1 || github.token }}
          card: stats
          options: "username=Dimasprog&show_icons=true&bg_color=0d1117&title_color=8B5CF6&icon_color=8B5CF6&text_color=c9d1d9&hide_border=true"
          path: "assets/github-readme-stats.svg"

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.PAT_1 || github.token }}
          card: top-langs
          options: "username=Dimasprog&layout=compact&langs_count=8&bg_color=0d1117&title_color=8B5CF6&text_color=c9d1d9&hide_border=true"
          path: "assets/top-langs.svg"

      - name: Generate trophies card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          token: ${{ secrets.PAT_1 || github.token }}
          options: "username=Dimasprog&theme=dark_lover&no-frame=true&no-bg=true&column=4&row=2&margin-w=15&margin-h=15"
          path: "assets/trophies.svg"

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub stats cards"
            git push
          else
            echo "No changes to commit"
          fi